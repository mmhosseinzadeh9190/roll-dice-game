<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A two-player dice game built with HTML, CSS, and JavaScript. Roll the dice, hold your current score, and be the first to reach 50 points!"
    />

    <title>Roll Dice</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="player player--0 player--active">
        <h2 class="name" id="name--0">Player 1</h2>
        <p class="score" id="score--0">13</p>
        <div class="current">
          <p class="current-label">Current</p>
          <p class="current-score" id="current--0">0</p>
        </div>
      </section>

      <section class="player player--1">
        <h2 class="name" id="name--1">Player 2</h2>
        <p class="score" id="score--1">23</p>
        <div class="current">
          <p class="current-label">Current</p>
          <p class="current-score" id="current--1">0</p>
        </div>
      </section>

      <img src="img/dice-5.png" alt="Dice face 5" class="dice" />

      <button type="button" class="btn btn--new">New game</button>
      <button type="button" class="btn btn--roll">Roll dice</button>
      <button type="button" class="btn btn--hold">Hold</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
